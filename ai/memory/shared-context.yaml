# shared-context.yaml
# 跨 agent 共用記憶 — 所有工具的 adapter 都應引用此檔
# 這裡存放所有 agent 都需要知道的上下文資訊

project:
  name: "Multi-Agent Workspace"
  owner: "周承泰"
  description: >
    多 AI agent 共用的操作系統。
    目標是讓 Claude、Codex、Gemini、OpenClaw 共用知識、技能和工作流程。

preferences:
  output_language: zh-TW
  technical_language: en
  formatting:
    prefer_yaml_over_json: true
    schema_format: json

terms:
  # 在這裡定義團隊專用術語、縮寫、暱稱
  # 所有 agent 都能理解同一套詞彙
  # 範例：
  # RSA: 回應式搜尋廣告 (Responsive Search Ads)
  # PMAX: Performance Max 廣告
  # SOT: Source of Truth (唯一來源)

workflow_notes:
  # 累積的工作流程筆記和決策紀錄
  # 範例：
  # - 2026-03-13: 決定以 Google Ads 素材生成作為第一個端到端驗證流程

active_agents:
  - name: claude
    config: CLAUDE.md
    skills_dir: .claude/skills/
  - name: codex
    config: AGENTS.md
    skills_dir: .agents/skills/
  - name: gemini
    config: GEMINI.md
    skills_dir: .gemini/
  - name: openclaw
    config: openclaw/agents/
    skills_dir: runtime/openclaw/
