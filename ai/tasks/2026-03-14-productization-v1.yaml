      destination: "ai/registry/supported-matrix.yaml"

    - description: "Canonical Brief Registry — 已核可的正式 brief 清單與版控政策"
      format: yaml
      destination: "ai/registry/canonical-briefs.yaml"

    - description: "Writer Spec — hillbed purchase PMax 的正式規格"
