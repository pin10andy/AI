    - description: "Regression Baseline — 品質回歸基準線"
      format: yaml
      destination: "ai/validation/regression-baseline-hillbed-pmax.yaml"

    - description: "Message Drift Report — 官網 vs brief vs 文案一致性比對"
      format: markdown
      destination: "ai/reports/2026-03-14-hillbed-message-drift.md"

    - description: "Release Note — 正式版本發布紀錄"
      format: markdown
      destination: "ai/releases/2026-03-productization-v1.md"

    - description: "Readiness Report — PM checkpoint 就緒報告"
      format: markdown
      destination: "ai/reports/2026-03-14-productization-v1-readiness.md"

    - description: "Known Issues — 已知限制與待處理事項"
      format: markdown
      destination: "ai/reports/2026-03-14-productization-v1-known-issues.md"

    - description: "ADR-002 — 產品化範圍決策紀錄"
      format: markdown
      destination: "ai/decisions/ADR-002-productization-v1-scope.md"

  validation:
    method: manual + automated
    rubric: ""
    passing_criteria: >
      四個 PM checkpoint 全通過：
      1. 正式可用 — hillbed purchase PMax 在 supported-matrix，status=production
      2. 可重跑 — 非作者可依 runbook 完成端到端流程
      3. 可稽核 — PM 可查 canonical brief、validation、boundaries、readiness
      4. 可擴張 — 新增 lane 不需修改既有檔案
    validation_file: "ai/validation/2026-03-14-productization-v1.md"

