      skill、metadata、references、playbook、schema、rubric 全部存在；
      JSON/YAML 可解析；skills sync 完成；
      skill 明確採用 Chrome MCP-first workflow，
      並在沒有 MCP 或沒有授權 session 時 fail closed。
    validation_file: "ai/validation/2026-03-24-facebook-chrome-scraper-mvp.md"
    governance_check: "not_applicable"

  notes: >
    本 MVP 只處理 interactive / small-batch scraping workflow，
    不做 headless stealth、帳密管理、CAPTCHA bypass 或大規模爬取排程。
    由於 workspace 尚未配置 Chrome MCP server，
    本次 validation 不含 live Facebook capture run。

