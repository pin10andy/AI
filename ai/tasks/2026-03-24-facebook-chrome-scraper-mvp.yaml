# Facebook Chrome Scraper MVP

task:
  task_id: "fb-chrome-skill-001"
  title: "Facebook Chrome Scraper MVP"
  status: validated
  owner: codex
  created_at: "2026-03-24"
  updated_at: "2026-03-24"

  goal: >
    將 `kevinzg/facebook-scraper` 的主要 Facebook 貼文/留言擷取能力，
    重構成適合 Codex 的 `facebook-chrome-scraper` skill，
    以 Chrome MCP 進行瀏覽、已登入 session 讀取與互動式小批量收集。

  background: >
    原始 repo 主要是 Python HTTP + cookies 解析器，
    支援 pages、profiles、groups、指定 post URLs、comments 與 reactors 等擷取面。
    但在 Codex 中，最佳整合點不是直接移植 requests-based scraper，
    而是把登入與頁面狀態交給 Chrome MCP，把 skill 本身定義為
    preflight、capture、normalization、limitations reporting workflow。

