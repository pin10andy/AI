# Auto Handoff Mechanism

task:
  task_id: "handoff-pipeline-001"
  title: "Auto Handoff Mechanism"
  status: validated
  owner: claude
  created_at: "2026-03-27"
  updated_at: "2026-03-27"

  goal: >
    實作 Claude → Codex → Claude 的自動化 handoff 機制，
    讓 Claude 完成規劃後可直接啟動 Codex 執行，
    Codex 完成後自動通知 Claude 進行 review，
    全程透過 repo artifacts 交接，不依賴 chat history。

  background: >
    目前 Claude 與 Codex 之間的交接需要人工操作：
    Claude 在 chat 中輸出規劃，使用者手動切換至 Codex session，
    再口頭轉述上下文。此機制目標是讓規劃產出直接成為 Codex 的
    執行入口，並透過 orchestrator script 自動建立 worktree 並啟動 Codex。

  references:
    brand: "ai/brand/master-brand.yaml"
    playbook: ""
    schema: "ai/schemas/handoff-status.schema.json"
    rubric: ""
    related_adr: "ai/decisions/ADR-009-handoff-status-execution-gates.md"
    related_tasks: []

  sub_tasks:
    - task_id: HANDOFF-001
      title: "建立 ai/handoffs/ 目錄結構與 status schema"
      status: approved
      dependencies: []
    - task_id: HANDOFF-002
      title: "撰寫 handoff_preflight.py"
      status: approved
      dependencies: [HANDOFF-001]
    - task_id: HANDOFF-003
      title: "撰寫 orchestrator.py"
      status: approved
      dependencies: [HANDOFF-002]
    - task_id: HANDOFF-004
      title: "撰寫 handoff_complete.py"
      status: approved
      dependencies: [HANDOFF-001]
    - task_id: HANDOFF-005
      title: "新增 handoff_e2e.py 驗證 canonical handoff flows"
      status: approved
      dependencies: [HANDOFF-003, HANDOFF-004]
    - task_id: HANDOFF-006
      title: "補 post-commit hook 與 remaining hardening debt"
      status: approved
      dependencies: [HANDOFF-003, HANDOFF-004, HANDOFF-005]

  deliverables:
    - description: "Handoff directory skeleton + templates + schema"
      format: directory + markdown + json
      destination: "ai/handoffs/ + ai/schemas/handoff-status.schema.json"
    - description: "Preflight validator"
      format: python
      destination: "scripts/handoff_preflight.py"
    - description: "Orchestrator"
      format: python
      destination: "scripts/orchestrator.py"
    - description: "Completion signal script"
      format: python
      destination: "scripts/handoff_complete.py"
    - description: "E2E validation harness"
      format: python
      destination: "scripts/handoff_e2e.py"
    - description: "Post-commit notification hook"
      format: bash
      destination: "scripts/hooks/post-commit + scripts/install-hooks.sh"
    - description: "Updated protocol + adapter docs"
      format: markdown
      destination: "docs/ai/HANDOFF_PROTOCOL.md + AGENTS.md + CLAUDE.md"

  validation:
    method: manual + structural + smoke test
    rubric: "docs/ai/VALIDATION_LEVELS.md"
    passing_criteria: >
      preflight.py, orchestrator.py, handoff_complete.py, handoff_e2e.py 均可 py_compile；
      handoff_preflight.py 對一個完整的 handoff package 返回 PASS；
      handoff_preflight.py 對一個不完整的 handoff package 返回 FAIL；
      handoff_e2e.py 對 canonical happy path / retry path / reviewer-only gate failures /
      illegal transitions / new_package_required refusal 返回 PASS matrix；
      post-commit hook 可被 install-hooks.sh 安裝，且在 pending handoff package 存在時輸出 orchestrator hint；
      AGENTS.md 與 CLAUDE.md 的 adapter/docs debt 留待後續治理。
    validation_file: "ai/validation/2026-03-27-auto-handoff-mechanism.md"
    governance_check: "not_applicable"

  known_risks:
    - "Codex CLI 啟動語法需在 HANDOFF-003 前確認（目前假設 codex '<prompt>'）"
    - "Claude review 自動觸發為 Phase 2，Phase 1 只做 print notification"
    - "預設 worktree root 仍採 repo sibling `../ai-worktrees/` 慣例；若部署環境不同，需透過 AI_WORKTREE_ROOT 或 --worktree-root 明確指定"
    - "repo 中仍缺少 execution brief / review brief template 檔案；HANDOFF-004 只處理 status writeback，不補模板治理"

  assumptions:
    - "post-commit hook 偵測到 pending handoff 後只 print 通知，不自動執行 orchestrator"
    - "review-brief.md 由 handoff_complete.py 建立空檔，Codex 在呼叫前填寫內容"
    - "HANDOFF-005 以 E2E validation harness 驗證整體 flow，不碰 hook 安裝或 adapter docs"
    - "`status.yaml.handoff_status` 是 handoff package execution state；`validated` / `shipped` 仍由 task lifecycle 管理"
    - "changes_requested 只適用於仍在原 package scope 內的 rework；超出 scope 必須新建 package"
    - "HANDOFF-006 只補 post-commit notification、ADR clarification、與 retry-path hardening；不重開 adapter/doc rewrite"

  metadata:
    created_by: claude
    compatible_agents:
      - codex
