# Experience Store PMax Booking Refresh
# 以三店合併投放為前提，從素材關聯報表整理出 booking-focused PMax draft。

task:
  task_id: "2026-03-16-experience-store-pmax-booking-refresh"
  title: "Experience Store PMax Booking Refresh"
  status: validated
  owner: codex
  created_at: "2026-03-16"
  updated_at: "2026-03-16"

  goal: >
    在不跳過 Google Ads workflow 的前提下，
    以三間體驗店合併投放為目標，整理現有效素材、退場不適合的舊文案，
    並產出一份聚焦「預約體驗」的 PMax draft pack。
  background: >
    使用者提供的是 Google Ads 素材資源關聯報表，而不是完整的 asset-level CTR / conversion 報表。
    因此這輪不能假裝做高信心成效結論，只能明確標示 data sufficiency，
    再用 association proxy 完成 retain / replace / new-test workflow。
    Repo 既有 hillbed tryout booking draft 與 store-visit testcase，
    但尚無 experience-store 的正式 draft brief 與 governed pipeline output。

  references:
    brand: "ai/brand/master-brand.yaml"
    playbook: "ai/playbooks/google-ads-pmax.md"
    schema: "ai/schemas/google-ads-pmax-output.schema.json"
    rubric: "ai/evals/google-ads-pmax-human-review.md"
    related_adr: "ai/decisions/ADR-002-productization-v1-scope.md"
    related_tasks:
      - "2026-03-15-hillbed-tryout-booking-init"

  deliverables:
    - description: "Draft brief for experience-store booking PMax"
      format: json
      destination: "ai/inputs/briefs/lovefu-pmax-experience-store-booking-draft.json"
    - description: "Pipeline input snapshot"
      format: json
      destination: "ai/outputs/google-ads/lovefu/experience-store/evergreen-store-visit-pmax/pipeline/2026-03-16-experience-store-pmax-booking-refresh/input.json"
    - description: "Booking-focused PMax JSON draft"
      format: json
      destination: "ai/outputs/google-ads/lovefu/experience-store/evergreen-store-visit-pmax/pipeline/2026-03-16-experience-store-pmax-booking-refresh/builder.json"
    - description: "Booking-focused PMax review markdown"
      format: markdown
      destination: "ai/outputs/google-ads/lovefu/experience-store/evergreen-store-visit-pmax/pipeline/2026-03-16-experience-store-pmax-booking-refresh/builder.md"

  validation:
    method: automated + manual
    rubric: "ai/evals/google-ads-pmax-human-review.md"
    passing_criteria: >
      Draft brief 通過 brief schema；
      builder.json 通過 PMax output schema 與 ad_copy_validator exact counts；
      artifact registry 與 governed path 完整；
      governance_check=pass；
      同時明確記錄資料不足與 LP alignment blocker，不把草稿誤標為 supported lane。
    validation_file: "ai/validation/2026-03-16-experience-store-pmax-booking-refresh.md"
    governance_check: pass

  notes: >
    這輪輸出是 draft pipeline，不是 supported capability，也不是 golden output。
    雖然 storage-map 與 governance layer 會新增對應 lane path，
    但 supported-matrix 仍保持不變。

  metadata:
    created_by: codex
    compatible_agents:
      - claude
      - codex
      - gemini
      - openclaw
