# Brief 版本控制政策
brief_version_policy:
  when_to_update:
    - "官網商品頁價格、保固、退款政策變更時"
    - "landing page hero message 或 CTA 變更時"
    - "品牌 forbidden_claims 或 must_avoid 擴張時"
    - "活動促案需要新增 offer 時（建議另開 brief 而非覆寫）"
  who_is_responsible: "PM 或品牌負責人"
  how_to_trigger_drift_check:
    - "每月定期比對官網商品頁與 brief 中的事實宣稱"
    - "任何 brief 更新前必須先跑 message drift report"
    - "drift report 格式見 ai/reports/ 下的 drift report"
  versioning_rule: "版號遞增，舊版 brief 標記 deprecated 但保留不刪除"
  update_flow:
    - "發現事實變更 → 跑 drift report → 更新 brief JSON"
    - "遞增 version → 記錄 version_history → 更新 updated_at"
    - "若影響 regression baseline，需重新建立 baseline"
