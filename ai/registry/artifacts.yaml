# artifacts.yaml
# Artifact registry for Google Ads formal outputs
# Every formal artifact MUST be registered here.
# For storage paths, see: ai/registry/storage-map.yaml
# For naming rules, see: ai/policies/artifact-naming-policy.md

version: "1.0"
created_at: "2026-03-16"
scope: google-ads

# ─────────────────────────────────────────────
# Field definitions
# ─────────────────────────────────────────────

field_definitions:
  artifact_id:
    type: string
    required: true
    description: "唯一識別碼，格式：{brief_id}.{artifact_type} 或 {task_id}.{artifact_type}"
    examples:
      - "lovefu-pmax-hillbed.golden"
      - "2026-03-15-pipeline-v1-2-uat.pipeline"

  task_id:
    type: string
    required: true
    description: "產生此 artifact 的任務 ID，對應 ai/tasks/ 下的檔案"
    examples:
      - "2026-03-14-google-ads-pmax-mvp"
      - "2026-03-15-google-ads-copy-pipeline-v1-2"

  artifact_type:
    type: enum
    required: true
    values: [golden, approved-reference, pipeline, deliverable]
    description: "Artifact 類型，對應 storage-map.yaml 中的 artifact_types。dry-run 已於 2026-03-16 重新分類為 approved-reference。"

  brand:
    type: string
    required: true
    description: "品牌 slug（kebab-case）"
    examples: [lovefu]

  product:
    type: string
    required: true
    description: "產品 slug（kebab-case）"
    examples: [hillbed]

  lane:
    type: string
    required: true
    description: "Lane ID，格式：{message_scope}-{goal}-{campaign_type}"
    examples: [evergreen-purchase-pmax]

  status:
    type: enum
    required: true
    values: [draft, validated, approved, superseded, archived]
    description: |
      draft: 已產出但未驗證
      validated: 已通過自動驗證
      approved: 已通過 human review
      superseded: 已被更新版本取代
      archived: 已歸檔不再使用

  canonical_path:
    type: string
    required: true
    description: "Artifact 在 repo 中的正式路徑（相對於 repo root）"

  source_brief:
    type: string
    required: true
    description: "來源 brief ID，對應 canonical-briefs.yaml"
    examples: [lovefu-pmax-hillbed]

  validation_refs:
    type: list
    required: false
    description: "相關驗證報告路徑列表"
    examples:
      - ["ai/validation/2026-03-14-google-ads-copy-mvp.md"]

  generated_by:
    type: string
    required: true
    description: "產出此 artifact 的 agent 或流程"
    examples: [claude, codex, gemini, openclaw, pipeline-v1.2, human]

  owner:
    type: string
    required: true
    description: "負責此 artifact 的角色或人員"
    examples: [pm, human, agent-team]

  created_at:
    type: string
    required: true
    format: "YYYY-MM-DD"
    description: "Artifact 建立日期"

  notes:
    type: string
    required: false
    description: "備註或附加說明"

